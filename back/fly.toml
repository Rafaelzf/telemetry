# app name is assigned by `fly launch` — replace the placeholder below
app = "telemetry-back"
primary_region = "gru"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOST = "0.0.0.0"

[deploy]
  release_command = "npx tsx src/database/migrate.ts latest"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
